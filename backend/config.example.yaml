# 이 파일은 git에 올라가는 "예시"다.
# 실제로 쓸 때는 이 파일을 config.yaml 로 복사한 뒤 비밀값을 채운다.
#   cp config.example.yaml config.yaml
# config.yaml 은 .gitignore 에 들어 있어 git에 올라가지 않는다.

app:
  timezone: "Asia/Seoul"
  invite_code: ""           # 연구실 가입 코드 (빈 값이면 회원가입 불가)
  jwt_secret: ""            # 긴 임의 문자열. 아래 명령으로 만들 수 있다:
                            #   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
  jwt_expire_days: 30
  database_path: "../data/gpu.db"   # 이 설정 파일 기준 상대경로. 운영 DB.
  static_dir: "../frontend/dist"    # `npm run build` 결과 폴더. FastAPI 가 화면도 같이 서빙한다.
                                    # 빈 값("")으로 두면 화면은 서빙하지 않고 API만 제공한다.

rules:
  slot_minutes: 60            # 예약 단위 (1시간). 예약은 정시에 시작해서 정시에 끝난다.
  timeline_days: 14           # 타임라인 화면이 한 번에 보여 주는 일수 (화면 표시용)
                              # 예약 가능 기간 제한이 아니다. 화면의 '이전/다음' 버튼으로
                              # 이 일수만큼 앞뒤로 옮겨 보면 더 먼 미래도 볼 수 있다.
                              #
                              # 예약 길이 제한(단주기 최대·장주기 최소 등)과
                              # '14일 이내 시작' 제한은 없다. 연구실에서 협의해 쓴다.
                              # 서버가 막는 것은 같은 GPU의 시간 겹침, 1시간 단위,
                              # 종료가 시작보다 뒤, 지난 시각 예약 금지 네 가지뿐이다.

gpus:                         # 서버3 A100/maxQ 번호가 반대면 여기만 고치면 된다
  - { server_no: 1, gpu_index: 0, model: "A6000",     category: short }
  - { server_no: 1, gpu_index: 1, model: "A6000",     category: short }
  - { server_no: 1, gpu_index: 2, model: "A6000",     category: long  }
  - { server_no: 1, gpu_index: 3, model: "A6000",     category: long  }
  - { server_no: 2, gpu_index: 0, model: "RTX 3090",  category: short }
  - { server_no: 2, gpu_index: 1, model: "RTX 3090",  category: short }
  - { server_no: 2, gpu_index: 2, model: "RTX 3090",  category: long  }
  - { server_no: 2, gpu_index: 3, model: "RTX 3090",  category: long  }
  - { server_no: 3, gpu_index: 0, model: "A100",      category: short }
  - { server_no: 3, gpu_index: 1, model: "A100",      category: long  }
  - { server_no: 3, gpu_index: 2, model: "maxQ 6000", category: short }
  - { server_no: 3, gpu_index: 3, model: "maxQ 6000", category: long  }

google:                       # Phase 6에서 사용. Phase 1에서는 읽기만 하고 쓰지 않는다.
  enabled: false
  calendar_id: "primary"
  credentials_path: "secrets/credentials.json"
  token_path: "secrets/token.json"
